<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Index — Pupputer</title>
<link rel="preload" href="./assets/font/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/font/inter-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
<link rel="alternate icon" href="./assets/icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
<link rel="mask-icon" href="./assets/icons/mask-icon.svg" color="#0066cc">
<link rel="manifest" href="./assets/manifest.webmanifest">
<meta name="msapplication-config" content="./assets/browserconfig.xml">
<meta property="og:title" content="Demo Index — Pupputer">
<meta property="og:description" content="Production-ready Tag Rendering Pipeline with Isolated Preview and Pure Library Distribution">
<meta property="og:image" content="./assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="./assets/images/twitter-card.png">
<link rel="stylesheet" href="./assets/styles/reset.css">
<link rel="stylesheet" href="./assets/font/font-face.css">
<link rel="stylesheet" href="./assets/font/typography.css">
<link rel="stylesheet" href="./assets/styles/syntax.css">
<link rel="stylesheet" href="./assets/styles/print.css" media="print">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="brand-header">
  <div class="brand-top">
    <div class="brand-logo-wrap">
      <img src="./assets/icons/logo.svg" alt="Pupputer" height="28" class="brand-logo">
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark/light theme">🌓 Theme</button>
  </div>
  <div class="brand-intro">
    <h1>Demo Index</h1>
    <p>Rendered from <code>examples/</code> with isolated pipelines.</p>
  </div>
</header>

<div class="search-wrap">
  <img src="./assets/icons/search.svg" alt="" width="16" height="16" class="search-icon">
  <input id="q" type="search" placeholder="Search tag...">
</div>

<main class="grid" id="grid">{{cards}}</main>

<footer class="site-footer">
  <div class="footer-status">
    <img src="./assets/icons/shield-check.svg" alt="Verified" width="16" height="16" class="status-icon">
    <span>Dual-Pipeline Architecture Verified &bull; Pure Library in <code>dist/</code></span>
  </div>
  <nav class="footer-links">
    <a href="./assets/robots.txt">robots.txt</a>
    <a href="./assets/sitemap.xml">sitemap.xml</a>
    <a href="./assets/humans.txt">humans.txt</a>
    <a href="./assets/security.txt">security.txt</a>
    <a href="./assets/font/README.md">font license</a>
  </nav>
</footer>

<script src="./assets/scripts/theme-toggle.js"></script>
<script src="./assets/scripts/back-to-top.js"></script>
<script src="./search.js"></script>
</body>
</html>
